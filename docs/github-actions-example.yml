name: Build web, APK & deploy

# ШАБЛОН. Скопируйте в .github/workflows/build.yml:
#   mkdir -p .github/workflows && cp docs/github-actions-example.yml .github/workflows/build.yml
# После push в разделе Actions появится артефакт corona-i-klinok-apk,
# а в Releases — постоянная ссылка на готовый APK для скачивания на телефон.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # для публикации APK в Releases
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: idle-rpg-dist
          path: dist
          retention-days: 14
      - name: Package for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the single-file game and OTA bundle
        run: npm ci && node scripts/publish-ota.mjs
      - name: Build and sign the APK
        run: bash android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: corona-i-klinok-apk
          path: download/corona-i-klinok.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: corona-i-klinok-ota
          path: |
            ota/game.html
            ota/manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish APK in Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Автоматическая сборка APK из коммита ${GITHUB_SHA::7}. Скачайте corona-i-klinok.apk на телефон, откройте в «Файлах» и разрешите установку из неизвестных источников."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest download/corona-i-klinok.apk --clobber
          else
            gh release create apk-latest download/corona-i-klinok.apk \
              --title "Корона и Клинок — APK" --notes "$NOTE"
          fi
          gh release upload apk-latest ota/game.html ota/manifest.json --clobber || true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
