plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.idlerpg.corona'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.idlerpg.corona'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    // No libraries: the WebView wrapper uses only platform APIs.
}
